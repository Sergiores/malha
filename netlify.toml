# Deploy na Netlify.
#
# O runtime de Next.js (OpenNext) é instalado automaticamente pela própria
# Netlify — não fixe a versão do adapter, ela o atualiza a cada build.
#
# O build command precisa do `prisma generate` antes do `next build`, o que
# o script `build` do package.json já faz.

[build]
  command = "npm run build"

[build.environment]
  # Fixa o Node para o build não mudar de comportamento quando a Netlify
  # trocar o default.
  NODE_VERSION = "22"

  # Skew protection: mantém a aba já aberta conversando com o deploy que ela
  # carregou. Sem isso, publicar enquanto alguém usa o sistema quebra a
  # sessão dele — cada build gera IDs novos de server action, e o JS antigo
  # chama um ID que não existe mais ("UnrecognizedActionError", e 404 nos
  # chunks). O usuário só percebe quando um botão para de responder.
  NETLIFY_NEXT_SKEW_PROTECTION = "true"
